name: PTY diagnostics

# Temporary (#122): reproduce the intermittent Interpreter PTY restart failure on pushed diag/122-* branches.
on:
  push:
    branches: ['diag/122-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Runtime versions and signal state
        run: |
          uname -r; nproc; bash --version | head -1; script --version
          grep -E 'SigBlk|SigIgn' /proc/$$/status
      - name: Full suite, as the release job runs it
        run: dotnet test tests/BoosterAI.Tests -c Release
