name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Release notes (fails without a current one-line summary)
        run: tools/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
      - name: Test
        run: dotnet test tests/BoosterAI.Tests -c Release
      - name: Package (win-x64 cross-published from Linux, linux-x64)
        run: tools/package.sh "$GITHUB_REF_NAME"
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/release/* \
            --title "BoosterAI ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md "${prerelease[@]}"
