name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Release notes (fails without a current one-line summary)
        run: tools/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
      - name: Test
        run: dotnet test tests/BoosterAI.Tests -c Release
      - name: Publish binaries (win-x64 cross-published from Linux, linux-x64)
        run: |
          VERSION="${GITHUB_REF_NAME#v}" tools/publish.sh win-x64 linux-x64
          cp tools/install-windows.ps1 dist/win-x64/
          mv release-notes.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            dist/win-x64/BoosterAI.exe
            dist/win-x64/install-windows.ps1
            dist/linux-x64/BoosterAI
            dist/release-notes.md
          if-no-files-found: error

  # Authenticode-signs the Windows files with Svep's Azure Artifact Signing profile.
  # Off until the repository variable SIGNING_ENABLED is 'true'; setup in docs/DEVELOPMENT.md#code-signing.
  # When enabled, a signing failure stops the release instead of shipping unsigned files.
  sign:
    needs: build
    if: vars.SIGNING_ENABLED == 'true'
    runs-on: windows-latest
    environment: signing
    permissions:
      contents: read
      id-token: write
    env:
      HAS_SECRET: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist
      - name: Azure login (OIDC, only without a client secret)
        if: env.HAS_SECRET != 'true'
        uses: azure/login@v2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          allow-no-subscriptions: true
      - name: Sign
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\dist\win-x64\BoosterAI.exe
            ${{ github.workspace }}\dist\win-x64\install-windows.ps1
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify signatures
        shell: pwsh
        env:
          EXPECTED_SUBJECT: ${{ vars.SIGNING_EXPECTED_SUBJECT }}
        run: |
          foreach ($f in 'dist\win-x64\BoosterAI.exe', 'dist\win-x64\install-windows.ps1') {
            $s = Get-AuthenticodeSignature -LiteralPath $f
            if ($s.Status -ne 'Valid') { throw "$f signature: $($s.Status) $($s.StatusMessage)" }
            if ($null -eq $s.TimeStamperCertificate) { throw "$f has no timestamp" }
            if ($env:EXPECTED_SUBJECT -and $s.SignerCertificate.Subject -notlike "*$env:EXPECTED_SUBJECT*") {
              throw "$f signed by unexpected publisher: $($s.SignerCertificate.Subject)"
            }
            "$f`n  signer: $($s.SignerCertificate.Subject) ($($s.SignerCertificate.Thumbprint))`n  timestamp: $($s.TimeStamperCertificate.Subject)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: signed-windows
          path: |
            dist/win-x64/BoosterAI.exe
            dist/win-x64/install-windows.ps1
          if-no-files-found: error

  release:
    needs: [build, sign]
    if: always() && needs.build.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist
      - name: Use the signed Windows files
        if: needs.sign.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: signed-windows
          path: dist/win-x64
      - name: Package (zip, tar.gz, SHA256SUMS of the final files)
        run: SKIP_PUBLISH=1 tools/package.sh "$GITHUB_REF_NAME"
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/release/* \
            --title "BoosterAI ${GITHUB_REF_NAME#v}" \
            --notes-file dist/release-notes.md "${prerelease[@]}"
