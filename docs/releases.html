      return out.filter(function (c) { return c.merged; }).concat(out.filter(function (c) { return !c.merged; }));
    }

    // A feature card; in the overview (card from group) it also names its versions and links all its issues.
    function feature(f) {
      var title = pick(f.title), howto = pick(f.howto);
      var img = safePath(pick(f.image));
      var issues = f.issues || (typeof f.issue === 'number' ? [f.issue] : []);
      var links = el('div', { class: 'links' });
      issues.forEach(function (n) { links.appendChild(ext(GH + '/issues/' + n, t('issue', { n: n }))); });
      if (docsUrl(f.docs)) links.appendChild(ext(docsUrl(f.docs), t('docs')));
      // "Versions 0.53.0, 0.53.1, 0.54.0", each version a link to its section further down.
      var versions = null;
      if (f.versions) {
        var parts = t(f.versions.length === 1 ? 'version1' : 'versionN').split('{v}');
        versions = el('div', { class: 'versions' }, [parts[0]]);
        f.versions.forEach(function (v, i) {
          if (i) versions.appendChild(document.createTextNode(', '));
          versions.appendChild(el('a', { href: '#v' + v, text: v }));
        });
        if (parts[1]) versions.appendChild(document.createTextNode(parts[1]));
      }
      var text = el('div', null, [
        el('h3', { text: title }),
        versions,
        howto ? el('div', { class: 'howto-label', text: t('howto') }) : null,
        howto ? el('p', { text: howto }) : null,
        links.childNodes.length ? links : null
      ]);
      var fig = img ? el('figure', null, [el('a', { href: img, target: '_blank', rel: 'noopener' }, [
        el('img', { src: img, alt: t('imgAlt', { t: title }), loading: 'lazy', decoding: 'async' })])]) : null;
      var a = el('article', { class: 'feature' + (img ? '' : ' no-image') }, [fig, text]);
      if (f.id) a.id = f.id;
      return a;
    }

    function release(r, i, ctx) {
      var tag = 'v' + r.version;
      var head = el('div', { class: 'release-head' }, [
        el('h2', null, [el('a', { href: '#' + tag, text: 'BoosterAI ' + r.version })]),
        r.date ? el('span', { class: 'date', text: new Date(r.date + 'T12:00:00Z').toLocaleDateString(lang === 'sv' ? 'sv-SE' : 'en-GB', { year: 'numeric', month: 'long', day: 'numeric' }) }) : null,
        ctx.to && r.version === ctx.to.text && ctx.from ? el('span', { class: 'tag running', text: t('yours') }) : (r === ctx.newest ? el('span', { class: 'tag', text: t('latest') }) : null)
      ]);
      var sum = r.summary && (r.summary[lang] || r.summary.en || r.summary.sv);
      var feats = (r.features || []).filter(function (f) { return f && (f.title || f.howto); });
      var changes = r.changes || [];
      var det = el('details', { class: 'changes' }, [el('summary', { text: t('changes', { n: changes.length }) }),
        changes.length ? el('ul', null, changes.map(subject)) : el('p', { text: t('noChanges') })]);
      // One release: its feature cards and the open list. Several: the cards are in the overview above, so the
      // release links its cards there and keeps the full list collapsed.
      var refs = null;
      if (ctx.cards) {
        var mine = ctx.cards.filter(function (c) { return feats.some(function (f) { return c.parts.indexOf(f) >= 0; }); });
        if (mine.length) {
          refs = el('p', { class: 'refs' }, [el('span', { text: t('newsIn') })]);
          mine.forEach(function (c) { refs.appendChild(el('a', { href: '#' + c.id, text: pick(c.title) })); });
        }
      } else if (ctx.count <= 3 || (!feats.length && i < 10)) det.open = true;
      var foot = el('div', { class: 'release-foot' }, [
        ext(GH + '/releases/tag/' + tag, t('release')),
        r.previous ? ext(GH + '/compare/v' + r.previous + '...' + tag, t('compare')) : null
      ]);
      return el('section', { class: 'release', id: tag }, [head, sum ? el('p', { class: 'summary', text: sum }) : null,
        refs, !ctx.cards && feats.length ? el('div', { class: 'features' }, feats.map(feature)) : null, det, foot]);
    }

    function render() {
      document.documentElement.lang = lang;
      document.title = t('title');
      document.querySelectorAll('[data-t]').forEach(function (e) { e.textContent = t(e.getAttribute('data-t')); });
      document.querySelectorAll('a[data-t="all"]').forEach(function (a) { a.setAttribute('href', allHref()); });
      document.querySelectorAll('.lang button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang)); });
      var list = document.getElementById('releases'), notices = document.getElementById('notices'), toc = document.getElementById('toc');
      notices.textContent = ''; toc.textContent = ''; toc.setAttribute('aria-label', t('tocLabel'));
      function notice(text, link) {
        notices.appendChild(el('p', { class: 'notice' }, [text, link ? ' ' : null, link]));
      }
      if (!data) {
        list.textContent = '';
        list.appendChild(el('p', { class: 'loading', text: t('loading') }));
        return;
      }
      if (!data.length) {
        list.textContent = '';
        list.appendChild(el('p', { class: 'empty' }, [t('failed'), ' ', ext(GH + '/releases', t('open'))]));
        return;
      }

      var rawFrom = params.get('from'), rawTo = params.get('to');
      var from = rawFrom ? parse(rawFrom) : null, to = rawTo ? parse(rawTo) : null;
      if (rawFrom && !from) notice(t('invalid', { v: rawFrom }));
      if (rawTo && !to) notice(t('invalid', { v: rawTo }));
      if (from && to && cmp(from, to) > 0) { var x = from; from = to; to = x; notice(t('swapped')); }
      var known = {};
      data.forEach(function (r) { known[r.version] = true; });
      [from, to].forEach(function (v) { if (v && !known[v.text]) notice(t('unknown', { v: v.text })); });
      if (from && to && cmp(from, to) === 0) { notice(t('same', { v: to.text })); from = null; params.set('only', '1'); }
      var only = from === null && to && params.get('only') === '1';
      params.delete('only');

      var shown = data.filter(function (r) {
        var v = parse(r.version);
        if (!v) return false;
        if (only) return cmp(v, to) === 0;
        return (!from || cmp(v, from) > 0) && (!to || cmp(v, to) <= 0);
      });
      if (fromApi) notice(t('fallback'));

      var title = document.getElementById('title'), sub = document.getElementById('subtitle');
      title.textContent = from ? t('h1Range', { from: from.text }) : t('h1');
      sub.textContent = '';
      var count = shown.length === 1 ? t('count1') : t('countN', { n: shown.length });
      if (from || to) {
        var range = from && to ? t('range', { from: from.text, to: to.text }) : from ? t('rangeFrom', { from: from.text }) : t('rangeTo', { to: to.text });
        sub.appendChild(el('span', { class: 'range', text: range }));
        sub.appendChild(document.createTextNode(' · ' + count));
      } else {
        sub.textContent = t('allIntro', { n: shown.length });
      }

      list.textContent = '';
      if (!shown.length) {
        list.appendChild(el('p', { class: 'empty' }, [t('empty'), ' ', el('a', { href: allHref(), text: t('showAll') })]));
        return;
      }
      var cards = shown.length > 1 ? group(shown) : null;
      if (cards && !cards.length) cards = null;
      if (cards) toc.appendChild(el('a', { href: '#overview', class: 'overview-link', text: t('toc') }));
      if (shown.length > 1 && shown.length <= 40) shown.forEach(function (r) {
        toc.appendChild(el('a', { href: '#v' + r.version, text: r.version }));
      });
      var ctx = { from: from, to: to, newest: data[0], count: shown.length, cards: cards };
      if (cards) list.appendChild(el('section', { class: 'release overview', id: 'overview' }, [
        el('div', { class: 'release-head' }, [el('h2', null, [el('a', { href: '#overview', text: t('overview') })])]),
        el('p', { class: 'summary', text: t('overviewIntro', { n: shown.length }) }),
        el('div', { class: 'features' }, cards.map(feature))]));
      shown.forEach(function (r, i) { list.appendChild(release(r, i, ctx)); });
      if (location.hash && document.getElementById(location.hash.slice(1))) document.getElementById(location.hash.slice(1)).scrollIntoView();
    }

    // A GitHub release body reduced to the releases.json shape: summary markers and the "## Changes" list.
    function fromGitHub(g) {
      var body = g.body || '', summary = {}, m, re = /<!--\s*summary:([a-z]{2})\s*:([\s\S]*?)-->/gi;
      while ((m = re.exec(body))) summary[m[1].toLowerCase()] = m[2].replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
      var changes = [], inChanges = false;
      body.split(/\r?\n/).forEach(function (line) {
        if (/^##\s/.test(line)) inChanges = /^##\s+Changes/i.test(line);
        else if (inChanges && /^- /.test(line)) changes.push(line.slice(2).trim());
      });
      var prev = /compare\/v([^.\s]+\.[^.\s]+\.[^.\s]+?)\.\.\.v/.exec(body);
      return { version: parse(g.tag_name).text, date: (g.published_at || '').slice(0, 10), previous: prev ? prev[1] : null,
        summary: summary, features: [], changes: changes };
    }

    function sortDesc(list) { return list.sort(function (a, b) { return cmp(parse(b.version), parse(a.version)); }); }

    function load() {
      var wanted = parse(params.get('to') || '');
      fetch('releases.json', { cache: 'no-cache' })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (j) {
          return (j.releases || []).filter(function (r) { return r && parse(r.version); });
        })
        .catch(function () { return []; })
        .then(function (local) {
          // The API fills in what the static file lacks: a release tagged after the last update, or a failed load.
          var newest = local.length ? parse(sortDesc(local.slice())[0].version) : null;
          if (local.length && !(wanted && newest && cmp(wanted, newest) > 0)) return local;
          return fetch(API, { headers: { Accept: 'application/vnd.github+json' } })
            .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
            .then(function (list) {
              var have = {};
              local.forEach(function (r) { have[r.version] = true; });
              list.forEach(function (g) {
                var v = !g.draft && !g.prerelease && parse(g.tag_name);
                if (v && !v.s && !have[v.text]) { local.push(fromGitHub(g)); fromApi = true; }
              });
              return local;
            })
            .catch(function () { return local; });
        })
        .then(function (all) { data = sortDesc(all); render(); });
    }

    document.querySelectorAll('.lang button').forEach(function (b) {
      b.addEventListener('click', function () {
        lang = b.getAttribute('data-lang');
        var p = new URLSearchParams(location.search);
        p.set('lang', lang);
        history.replaceState(null, '', '?' + p.toString() + location.hash);
        render();
      });
    });
    render();
    load();
  })();
  </script>
</body>
</html>
